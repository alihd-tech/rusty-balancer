listen = "127.0.0.1:8080"
upstream_timeout_ms = 5000

[pools.app]
algorithm = "weighted_round_robin"

[[pools.app.endpoints]]
url = "http://127.0.0.1:9001"
weight = 2

[[pools.app.endpoints]]
url = "http://127.0.0.1:9002"
weight = 1

[pools.app.health]
path = "/"
interval_ms = 5000
timeout_ms = 1000
healthy_threshold = 1
unhealthy_threshold = 2

[[routes]]
path_prefix = "/api"
pool = "app"

[[routes]]
path_prefix = "/"
static_dir = "examples/public"
