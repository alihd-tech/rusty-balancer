name: Rust CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Require committed dependency lockfile
        run: test -f Cargo.lock || { echo "::error::Cargo.lock must be generated and committed"; exit 1; }
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Locked workspace compilation
        run: cargo check --locked --workspace
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Unit and integration tests
        run: cargo test --locked --workspace
      - name: TLS, management and transport smoke tests
        run: TLS_SMOKE=1 ADMIN_SMOKE=1 NETWORK_SMOKE=1 bash scripts/check.sh
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: RustSec advisory audit
        run: cargo audit --deny warnings

  http3:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Require committed dependency lockfile
        run: test -f Cargo.lock
      - name: Check HTTP/3 smoke prerequisites
        run: curl --version | grep -q HTTP3 || { echo "::error::Runner curl lacks HTTP/3 support; provision an HTTP/3-capable runner"; exit 1; }
      - name: HTTP/3 end-to-end smoke
        run: bash scripts/http3-smoke.sh
