name: Pin Rust dependencies
# Temporary branch-only formatting and dependency locking assistant.
# Final formatting pass after strict Clippy remediation.

on:
  push:
    branches:
      - hardening/p0-p1-20261121
    paths:
      - Cargo.toml
      - crates/**/Cargo.toml
      - .github/workflows/pin-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Generate lockfile and normalize workspace formatting
        run: |
          cargo generate-lockfile
          cargo fmt --all
          git add Cargo.lock crates
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: pin Rust dependencies and normalize formatting"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
