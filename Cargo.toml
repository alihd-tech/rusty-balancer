[workspace]
resolver = "2"
members = [
  "crates/balancer-config",
  "crates/balancer-lb",
  "crates/balancer-proxy",
  "crates/balancer-http",
  "crates/balancer-cli",
  "crates/balancer-tls",
  "crates/balancer-middleware",
  "crates/balancer-api",
  "crates/balancer-observability",
]
default-members = ["crates/balancer-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["http2"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
bytes = "1"
futures-util = "0.3"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "webpki-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-acme = { version = "0.15.4", default-features = false, features = ["axum", "ring", "tls12", "webpki-roots"] }
rustls-pemfile = "2"
webpki-roots = "1"
balancer-tls = { path = "crates/balancer-tls" }
clap = { version = "4.5", features = ["derive"] }
http = "1"
http-body = "1"
httpdate = "1"
ipnet = { version = "2", features = ["serde"] }
sha1 = "0.10"
base64 = "0.22"
balancer-middleware = { path = "crates/balancer-middleware" }
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
arc-swap = "1"
balancer-api = { path = "crates/balancer-api" }
balancer-observability = { path = "crates/balancer-observability" }
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "compression-br", "compression-zstd"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
balancer-config = { path = "crates/balancer-config" }
balancer-lb = { path = "crates/balancer-lb" }
balancer-proxy = { path = "crates/balancer-proxy" }
balancer-http = { path = "crates/balancer-http" }

[profile.release]
lto = "thin"
